<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spesa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<title>Spesa</title>
</head>
<body>
<main class="app">
  <div class="top"><h1>Spesa</h1><span class="status" id="status">Condivisa</span></div>
  <section id="setup" class="card setup" hidden>
    <h2>Collega la lista</h2>
    <p>Apri il link condiviso oppure incolla qui il codice della lista.</p>
    <input id="codeInput" placeholder="Codice lista" autocomplete="off">
    <button id="saveCode">Collega</button>
  </section>
  <section id="main" hidden>
    <div class="card add">
      <input id="itemInput" placeholder="Aggiungi prodotto…" autocomplete="off">
      <input id="qtyInput" placeholder="Qtà" autocomplete="off">
      <button id="addBtn" aria-label="Aggiungi">+</button>
    </div>
    <div class="toolbar">
      <div class="count" id="count">0 da prendere</div>
      <div class="actions">
        <button class="smallbtn" id="shareBtn">Condividi</button>
        <button class="smallbtn" id="clearBtn">Pulisci</button>
      </div>
    </div>
    <div id="content"></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
