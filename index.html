<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f7ff">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spesa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=16">
<title>Spesa</title>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <div class="eyebrow">LISTA CONDIVISA</div>
      <h1>Spesa</h1>
    </div>
    <button id="shareBtn" class="shareBtn" type="button" aria-label="Condividi lista">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7.5 7.5 4.5-4.5 4.5 4.5"/><path d="M5 11v8h14v-8"/></svg>
    </button>
  </header>

  <section id="setup" class="glass setup" hidden>
    <h2>Collega la lista</h2>
    <p>Inserisci il codice condiviso una sola volta su questo dispositivo.</p>
    <input id="codeInput" placeholder="Codice lista" autocomplete="off">
    <button id="saveCode">Collega</button>
  </section>

  <section id="main" hidden>
    <div class="glass addBox">
      <input id="itemInput" placeholder="Cosa serve?" autocomplete="off" enterkeyhint="done">
      <button id="addBtn" type="button" aria-label="Aggiungi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="trashBtn" class="trashTop" type="button" aria-label="Recupera articoli eliminati">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="m7 7 1 13h8l1-13"/></svg>
      </button>
    </div>

    <div class="listHead">
      <span id="count">0 articoli</span>
      <span id="status" class="status">Sincronizzata</span>
    </div>

    <div id="content"></div>
  </section>
</main>
<div class="trashModal" id="trashModal" aria-hidden="true">
  <div class="trashSheet">
    <div class="trashHead">
      <div>
        <div class="eyebrow">CESTINO</div>
        <h2>Recupera</h2>
      </div>
      <div class="trashHeadActions">
        <button id="trashClear" class="trashClear" type="button">Elimina tutto</button>
        <button id="trashClose" class="trashClose" type="button" aria-label="Chiudi">×</button>
      </div>
    </div>
    <div id="trashList" class="trashList"></div>
  </div>
</div>
<div class="doneOverlay" id="doneOverlay" aria-hidden="true"><div class="doneCheck">✓</div></div>
<div class="toast" id="toast"></div>
<script src="app.js?v=15"></script>
</body>
</html>
